[workspace]
name = "hugo-atom-layout"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
pytest = ">=8"
hugo = "==0.164.0"
dart-sass = "==1.101.3"

[tasks.fetch-test-theme]
cmd = "scripts/fetch-test-theme.sh"

[tasks.test]
cmd = "python -m pytest"
depends-on = ["fetch-test-theme"]

[tasks.test-atom]
cmd = "python -m pytest tests/test_atom.py -v"
depends-on = ["fetch-test-theme"]
